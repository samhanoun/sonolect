[package]
name = "sonolect_desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
whisper-rs = { version = "=0.16.0", default-features = false }
hound = "3.5"
sha2 = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
base64 = "0.23"
# Saved recordings as Ogg Opus. libopus is bundled and built with cmake, which whisper-rs already needs.
opus = "0.4"
ogg = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
# OS keychains: provider API keys (Windows) and the sync key (every platform).
keyring = { version = "3.6", features = ["windows-native"] }
# In-process paste: clipboard write kept out of clipboard history, then Ctrl+V via SendInput.
arboard = { version = "3.7", default-features = false }
enigo = { version = "0.6", default-features = false }
# Dictation bubble: remember the app being dictated into and give focus back to it.
# System audio: WASAPI loopback recording of the default playback device.
cpal = "0.18"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

# The sync key lives in the macOS Keychain.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

# The sync key lives in the Secret Service (GNOME Keyring, KWallet), over
# D-Bus (libdbus-1-dev and pkg-config to build), with Rust crypto, not OpenSSL.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[features]
default = []

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
