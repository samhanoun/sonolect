name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.15.0

jobs:
  quality:
    name: Quality (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  desktop-e2e:
    name: Desktop Playwright E2E
    # Playwright 1.59 cannot install browser deps on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @sonolect/desktop exec playwright install --with-deps chromium

      - name: Run desktop Playwright E2E
        run: pnpm --filter @sonolect/desktop e2e

  config-validation:
    name: Config validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate JSON files
        run: |
          node -e "const fs=require('fs'); const cp=require('child_process'); const files=cp.execSync('git ls-files \"*.json\"',{encoding:'utf8'}).trim().split(/\n/).filter(Boolean); for (const file of files) { JSON.parse(fs.readFileSync(file,'utf8')); console.log('ok', file); }"

      - name: Validate YAML files
        run: |
          for file in $(git ls-files "*.yml" "*.yaml"); do
            echo "validating ${file}"
            npx --yes yaml valid < "${file}"
          done

      - name: Check release readiness
        run: pnpm test:release-readiness

      - name: Release readiness dry-run validation
        run: pnpm release:dry-run

      - name: Check formatting
        run: pnpm format:check

  release-package-validation:
    name: Release package validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg
            artifact_glob: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundles: nsis,msi
            artifact_glob: |
              apps/desktop/src-tauri/target/release/bundle/**/*.msi
              apps/desktop/src-tauri/target/release/bundle/**/*.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native installer bundle
        run: pnpm --filter @sonolect/desktop tauri build --bundles ${{ matrix.bundles }}

      - name: Validate macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          test ${#artifacts[@]} -gt 0
          for artifact in "${artifacts[@]}"; do
            test -s "${artifact}"
            hdiutil verify "${artifact}"
            codesign --verify --deep --strict "${artifact}" || echo "Unsigned DMG accepted for PR validation"
          done

      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem apps/desktop/src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe
          if ($artifacts.Count -eq 0) { throw "No Windows installers were produced" }
          foreach ($artifact in $artifacts) {
            if ($artifact.Length -le 0) { throw "Empty installer: $($artifact.FullName)" }
            Get-AuthenticodeSignature $artifact.FullName | Format-List
          }

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-packages
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 7

  terraform:
    name: Terraform formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform fmt
        run: terraform fmt -check -recursive

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # Gate on critical severity. The remaining moderate/high advisories are
        # transitive dependencies of apps/mobile (Expo / React Native / Firebase),
        # which is out of the current product scope and tracked separately. The
        # one critical (shell-quote) is patched via pnpm.overrides.
        run: pnpm audit --audit-level critical

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
