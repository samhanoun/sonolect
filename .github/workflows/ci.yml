name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner selection: GitHub-hosted by default. Set the repository variable
# LINUX_RUNNER (e.g. ["self-hosted","Linux","laptop"]) and/or WINDOWS_RUNNER
# to a JSON label list to route jobs to self-hosted runners; delete the
# variable to switch back. Fork PRs always stay on GitHub-hosted runners.

env:
  PNPM_VERSION: 9.15.0

jobs:
  quality:
    name: Quality (${{ matrix.node-version }})
    runs-on: instabox-medium
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  mobile-bundle:
    name: Mobile web bundle
    runs-on: instabox-medium
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle the mobile app (catches Metro resolution errors)
        run: pnpm --filter @sonolect/mobile exec expo export --platform web --output-dir dist-web

      - name: Generate native projects (catches config plugin errors)
        run: pnpm --filter @sonolect/mobile exec expo prebuild --no-install --clean

  mobile-android:
    name: Mobile Android build
    runs-on: instabox-medium
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the Android versions React Native builds with
        id: android-versions
        working-directory: apps/mobile
        # Expo's Gradle plugin takes compileSdk, build-tools and the NDK from
        # React Native's version catalog. Installing exactly those means an
        # Expo SDK upgrade needs no edit here.
        run: |
          catalog="$(node -p "require('path').join(require('path').dirname(require.resolve('react-native/package.json')), 'gradle', 'libs.versions.toml')")"
          read_version() { sed -n "s/^$1 = \"\([^\"]*\)\"$/\1/p" "$catalog"; }
          compile_sdk="$(read_version compileSdk)"
          build_tools="$(read_version buildTools)"
          ndk="$(read_version ndkVersion)"
          if [ -z "$compile_sdk" ] || [ -z "$build_tools" ] || [ -z "$ndk" ]; then
            echo "::error::Could not read the Android versions from $catalog"
            exit 1
          fi
          echo "React Native wants compileSdk $compile_sdk, build-tools $build_tools, NDK $ndk"
          echo "compile-sdk=$compile_sdk" >> "$GITHUB_OUTPUT"
          echo "packages=platform-tools platforms;android-$compile_sdk build-tools;$build_tools ndk;$ndk cmake;3.22.1" >> "$GITHUB_OUTPUT"

      - name: Setup Android SDK
        # GitHub images ship the SDK; self-hosted runners may not. The action's
        # default list includes the obsolete "tools" package, which a fresh SDK
        # cannot install, so list what this build needs.
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
          packages: ${{ steps.android-versions.outputs.packages }}

      - name: Generate the Android project
        run: pnpm --filter @sonolect/mobile exec expo prebuild --no-install --clean --platform android

      - name: Build an installable APK
        # The template signs release builds with the debug keystore, so this
        # APK installs on any Android phone for testing (not for the store).
        # arm64-v8a covers current phones and halves native compile time.
        working-directory: apps/mobile/android
        env:
          COMPILE_SDK: ${{ steps.android-versions.outputs.compile-sdk }}
        run: |
          # Point Gradle at the SDK that setup-android installed (a fresh
          # self-hosted SDK lives under $HOME), and fail early if it is missing.
          test -d "$ANDROID_HOME/platforms/android-$COMPILE_SDK" || { echo "::error::No Android SDK platform $COMPILE_SDK under $ANDROID_HOME"; exit 1; }
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload the test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonolect-android-test-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error

  desktop-e2e:
    name: Desktop Playwright E2E
    # Playwright 1.59 cannot install browser deps on ubuntu-latest (26.04) yet.
    runs-on: instabox-medium
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @sonolect/desktop exec playwright install --with-deps chromium

      - name: Run desktop Playwright E2E
        run: pnpm --filter @sonolect/desktop e2e

  desktop-rust:
    name: Desktop Rust (fmt, clippy, test)
    runs-on: instabox-medium
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Install Tauri Linux system libraries
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

  config-validation:
    name: Config validation
    runs-on: instabox-medium
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate JSON files
        run: |
          node -e "const fs=require('fs'); const cp=require('child_process'); const files=cp.execSync('git ls-files \"*.json\"',{encoding:'utf8'}).trim().split(/\n/).filter(Boolean); for (const file of files) { JSON.parse(fs.readFileSync(file,'utf8')); console.log('ok', file); }"

      - name: Validate YAML files
        run: node scripts/validate-yaml.mjs

      - name: Check release readiness
        run: pnpm test:release-readiness

      - name: Release readiness dry-run validation
        run: pnpm release:dry-run

      - name: Check formatting
        run: pnpm format:check

  release-package-validation:
    name: Release package validation (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'windows-latest' && vars.WINDOWS_RUNNER != '' && github.event.pull_request.head.repo.fork != true && fromJSON(vars.WINDOWS_RUNNER) || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg
            artifact_glob: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundles: nsis,msi
            artifact_glob: |
              apps/desktop/src-tauri/target/release/bundle/**/*.msi
              apps/desktop/src-tauri/target/release/bundle/**/*.exe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native installer bundle
        run: pnpm --filter @sonolect/desktop tauri build --bundles ${{ matrix.bundles }}

      - name: Validate macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          test ${#artifacts[@]} -gt 0
          for artifact in "${artifacts[@]}"; do
            test -s "${artifact}"
            hdiutil verify "${artifact}"
            codesign --verify --deep --strict "${artifact}" || echo "Unsigned DMG accepted for PR validation"
          done

      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem apps/desktop/src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe
          if ($artifacts.Count -eq 0) { throw "No Windows installers were produced" }
          foreach ($artifact in $artifacts) {
            if ($artifact.Length -le 0) { throw "Empty installer: $($artifact.FullName)" }
            Get-AuthenticodeSignature $artifact.FullName | Format-List
          }

      - name: Upload package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}-packages
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 7

  terraform:
    name: Terraform formatting
    runs-on: instabox-medium
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.7.5

      - name: Terraform fmt
        run: terraform fmt -check -recursive

  security:
    name: Dependency and secret scanning
    runs-on: instabox-medium
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # Gate on critical severity. The remaining moderate/high advisories are
        # transitive dependencies of apps/mobile (Expo / React Native / Firebase),
        # which is out of the current product scope and tracked separately. The
        # one critical (shell-quote) is patched via pnpm.overrides.
        run: pnpm audit --audit-level critical

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action downloads to $TMPDIR/gitleaks.tmp and never removes
          # it, so on a reused (self-hosted) runner the next run fails with
          # "already exists". The per-job runner temp dir is wiped every job.
          TMPDIR: ${{ runner.temp }}
