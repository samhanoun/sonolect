name: Security (SAST + SCA)

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily so newly published advisories surface without a code change.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST (code, Dockerfiles, Terraform, workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.184.0
    # Dependabot PRs cannot upload SARIF; they are covered by the SCA jobs.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan (report all findings)
        run: >-
          semgrep scan --metrics=off --sarif --output semgrep.sarif
          --config p/default --config p/typescript --config p/react
          --config p/nodejs --config p/rust --config p/secrets
          --config p/dockerfile --config p/terraform --config p/github-actions

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Gate on ERROR-severity findings
        run: >-
          semgrep scan --metrics=off --error --severity ERROR
          --config p/default --config p/typescript --config p/react
          --config p/nodejs --config p/rust --config p/secrets
          --config p/dockerfile --config p/terraform --config p/github-actions

  osv-scanner:
    name: OSV-Scanner SCA (pnpm + Cargo lockfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install OSV-Scanner
        run: |
          curl -sSfL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64
          chmod +x osv-scanner

      - name: Scan lockfiles
        # Reports every known vulnerability to code scanning. Blocking is done
        # by dependency-review (new deps) and the audit jobs below.
        run: ./osv-scanner scan source --recursive --format sarif --output osv.sarif . || true

      - name: Upload SARIF to code scanning
        if: github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  cargo-audit:
    name: cargo-audit (desktop Rust crates)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Cargo.lock
        # Fails on vulnerabilities. "Unmaintained"/"unsound" notices for
        # Tauri's transitive GTK and unic crates are reported as warnings only.
        run: cargo audit

  npm-audit:
    name: pnpm audit gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate on high/critical advisories (desktop, services, packages)
        # apps/mobile is excluded because its Expo/React Native toolchain is
        # being replaced; the CI security job still gates it on critical.
        # Accepted advisories are listed in scripts/audit-gate.mjs and
        # docs/security-scan-triage.md.
        run: node scripts/audit-gate.mjs

  dependency-review:
    name: Dependency review (new deps in this PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: on-failure

  gitleaks:
    name: Secret scanning (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
