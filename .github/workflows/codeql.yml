name: CodeQL (SAST)

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly full scan so new queries catch issues in unchanged code.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    # CodeQL needs code scanning enabled for the repo (GitHub Code Security on
    # private repos). Set repository variable ENABLE_CODE_SCANNING=true once on.
    if: vars.ENABLE_CODE_SCANNING == 'true'
    runs-on: instabox-medium
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # build-mode "none" analyses source directly: no build or toolchain needed.
        language: [javascript-typescript, rust, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - "**/node_modules/**"
              - "**/dist/**"
              - "**/target/**"
              - "apps/desktop/src-tauri/gen/**"

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
