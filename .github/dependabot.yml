version: 2
updates:
  # JS/TS workspace (single pnpm lockfile at the repo root).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  # Tauri desktop shell crates.
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
    groups:
      tauri:
        patterns: ["tauri*"]
      rust-minor-patch:
        update-types: [minor, patch]

  # Pinned action SHAs in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Service base images.
  - package-ecosystem: docker
    directories:
      - /services/agent-service
      - /services/api
      - /services/audio-service
      - /services/billing-service
      - /services/sync-service
      - /services/worker-service
    schedule:
      interval: weekly
    groups:
      node-base-image:
        patterns: ["*"]

  # Terraform providers.
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
