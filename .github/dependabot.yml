version: 2
updates:
  # JS/TS workspace (single pnpm lockfile at the repo root).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # The Expo SDK fixes these versions for the mobile app, and bumping one
      # alone breaks the native build. They move together in an Expo SDK
      # upgrade (`npx expo install --fix` in apps/mobile) instead.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/*"
      # React must match the renderer inside React Native, and the desktop app
      # stays on the same React, so React also moves with the Expo SDK.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react-dom"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  # Tauri desktop shell crates.
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
    groups:
      tauri:
        patterns: ["tauri*"]
      rust-minor-patch:
        update-types: [minor, patch]

  # Pinned action SHAs in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Service base images.
  - package-ecosystem: docker
    directories:
      - /services/agent-service
      - /services/api
      - /services/audio-service
      - /services/billing-service
      - /services/sync-service
      - /services/worker-service
    schedule:
      interval: weekly
    groups:
      node-base-image:
        patterns: ["*"]

  # Terraform providers.
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
