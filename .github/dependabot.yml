version: 2
updates:
  # JS/TS workspace (single pnpm lockfile at the repo root).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # The Expo SDK fixes these versions for the mobile app, and bumping one
      # alone breaks the native build. They move together in an Expo SDK
      # upgrade (`npx expo install --fix` in apps/mobile) instead.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/*"
      # React must match the renderer inside React Native, and the desktop app
      # stays on the same React, so React also moves with the Expo SDK.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react-dom"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      # The mobile app's Babel 7 (from the Expo SDK) imports its helpers from
      # @babel/runtime 7. With @babel/runtime 8 it copies them into every file
      # instead. Move to 8 with the Expo SDK that moves to Babel 8.
      - dependency-name: "@babel/runtime"
        update-types: ["version-update:semver-major"]
      # @types/node follows the oldest Node the code runs on (Node 22: CI
      # matrix [22, 24], LOCAL-BUILD.md, esbuild target node22). Bump its
      # major by hand when that floor moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  # Tauri desktop shell crates.
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
    groups:
      tauri:
        patterns: ["tauri*"]
      rust-minor-patch:
        update-types: [minor, patch]

  # Pinned action SHAs in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Service base images.
  - package-ecosystem: docker
    directories:
      - /services/agent-service
      - /services/api
      - /services/audio-service
      - /services/billing-service
      - /services/sync-service
      - /services/worker-service
    schedule:
      interval: weekly
    groups:
      node-base-image:
        patterns: ["*"]

  # Terraform providers: the platform root and the sync service's own root.
  - package-ecosystem: terraform
    directories:
      - /infra/terraform
      - /infra/terraform/sync
    schedule:
      interval: weekly
